<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASF Diário — Diário de Surf</title>
<meta name="description" content="Diário de surf digital: registre sessões, ondas e evolução. Satélite do app ASF.">
<style>:root{--p:#00a8cc;--pd:#0e2439;--g:#f4d03f}*{box-sizing:border-box;margin:0}body{font-family:system-ui,sans-serif;background:#f6fbfd;color:var(--pd)}nav{background:var(--pd);padding:9px 12px;display:flex;flex-wrap:wrap;gap:6px}nav a{color:#fff;text-decoration:none;font-size:11px;font-weight:600;padding:4px 8px;border-radius:20px;background:rgba(255,255,255,.08)}nav a.hub{background:var(--g);color:var(--pd)}header{padding:36px 20px;text-align:center;background:linear-gradient(135deg,#f4d03f22,#00a8cc18)}h1{font-size:26px}main{max-width:600px;margin:22px auto;padding:0 16px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}label{font-size:12px;font-weight:600;color:#567;display:block;margin:8px 0 3px}input,select,textarea{width:100%;padding:9px;border:1.5px solid #dde;border-radius:9px;font-size:14px;font-family:inherit}.btn{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;border:none;border-radius:10px;padding:12px;width:100%;font-weight:600;cursor:pointer;margin-top:12px;font-size:14px}.entry{border-left:3px solid var(--p);padding:8px 12px;margin-bottom:10px;background:#fafdff;border-radius:8px}.entry b{font-size:14px}.entry small{color:#789}.entry p{font-size:13px;margin-top:3px}footer{text-align:center;padding:26px;font-size:12px;color:#678}</style>
</head>
<body>
<nav>
<a class="hub" href="https://acarolmourad-commits.github.io/asf-app/">🏄‍♀️ ASF App</a>
<a href="https://acarolmourad-commits.github.io/asf-previsao/">🌊</a>
<a href="https://acarolmourad-commits.github.io/asf-praias/">🏖️</a>
<a href="https://acarolmourad-commits.github.io/asf-treino/">💪</a>
<a href="https://acarolmourad-commits.github.io/asf-eventos/">📅</a>
<a href="https://acarolmourad-commits.github.io/asf-glossario/">📖</a>
<a href="https://acarolmourad-commits.github.io/asf-comunidade/">💜</a>
<a href="https://acarolmourad-commits.github.io/asf-seguranca/">🛟</a>
<a href="https://acarolmourad-commits.github.io/asf-quiz/">🧠</a>
<a href="https://acarolmourad-commits.github.io/asf-equipamento/">🏄</a>
<a href="https://acarolmourad-commits.github.io/asf-nutricao/">🥑</a>
<a href="https://acarolmourad-commits.github.io/asf-viagens/">✈️</a>
<a href="https://acarolmourad-commits.github.io/asf-historia/">📜</a>
<a href="https://acarolmourad-commits.github.io/asf-respira/">🫁</a>
<a href="https://acarolmourad-commits.github.io/asf-volume/">📐</a>
</nav>
<header><h1>📓 ASF Diário</h1><p>Registre cada sessão e veja sua evolução — tudo salvo no seu navegador</p></header>
<main>
<div class="card">
<label>Praia / Pico</label><input id="f-beach" placeholder="Ex.: Praia Grande, Ubatuba">
<label>Data</label><input id="f-date" type="date">
<label>Tamanho das ondas</label><select id="f-size"><option>0.5m — fraquinho</option><option>1m — divertido</option><option>1.5m — bom</option><option>2m+ — pesado!</option></select>
<label>Como foi?</label><textarea id="f-notes" rows="3" placeholder="Ondas pegas, manobras, como se sentiu..."></textarea>
<button class="btn" onclick="save()">💾 Salvar sessão</button>
</div>
<div class="card"><h3 style="font-size:15px;margin-bottom:10px">🌊 Suas sessões (<span id="total">0</span>)</h3><div id="list"><p style="font-size:13px;color:#789">Nenhuma sessão registrada ainda. Bora surfar e registrar! 🏄‍♀️</p></div>
<button class="btn" style="background:#fff;color:var(--p);border:1.5px solid var(--p)" onclick="exp()">⬇️ Exportar diário (JSON)</button>
</div>
</main>
<footer>Parte da constelação ASF • <a href="https://acarolmourad-commits.github.io/asf-app/">Voltar ao app principal</a></footer>
<script>
const K='asf-diario';
const load=()=>JSON.parse(localStorage.getItem(K)||'[]');
function save(){
 const b=document.getElementById('f-beach').value.trim();if(!b){alert('Qual praia? 🏖️');return}
 const d=load();d.unshift({beach:b,date:document.getElementById('f-date').value||new Date().toISOString().slice(0,10),size:document.getElementById('f-size').value,notes:document.getElementById('f-notes').value});
 localStorage.setItem(K,JSON.stringify(d));
 document.getElementById('f-beach').value='';document.getElementById('f-notes').value='';render();
}
function del(i){const d=load();d.splice(i,1);localStorage.setItem(K,JSON.stringify(d));render()}
function render(){
 const d=load();document.getElementById('total').textContent=d.length;
 if(!d.length)return;
 document.getElementById('list').innerHTML=d.map((e,i)=>'<div class="entry"><b>🏄‍♀️ '+e.beach+'</b> <small>'+e.date+' • '+e.size+'</small> <a href="#" onclick="del('+i+');return false" style="float:right;color:#e74c3c;font-size:12px">excluir</a><p>'+(e.notes||'')+'</p></div>').join('');
}
function exp(){const blob=new Blob([JSON.stringify(load(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='asf-diario.json';a.click()}
document.getElementById('f-date').value=new Date().toISOString().slice(0,10);render();
</script>
</body>
</html>
